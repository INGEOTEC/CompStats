[build-system]
# 77 is the first setuptools that accepts the SPDX string form `license = "Apache-2.0"`
# used below.
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = 'CompStats'
description = 'CompStats implements an evaluation methodology for statistically analyzing competition results and competition'
readme = "README.rst"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    'numpy',
    'scikit-learn>=1.3.0',
    'pandas',
    'seaborn>=0.13.0',
    'statsmodels'
]
dynamic = ['version']

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis"
]

[project.optional-dependencies]
# `packaging` is only needed by scripts/check_package_versions.py and its test.
test = ["pytest>=7.0", "packaging"]

[tool.setuptools.dynamic]
version = {attr = 'CompStats.__version__'}

[tool.setuptools]
packages = ['CompStats', 'CompStats.tests']

[project.urls]
Homepage = "https://ingeotec.github.io/CompStats/"
Documentation = "https://ingeotec.github.io/CompStats/"
"Developer documentation" = "https://ingeotec.github.io/CompStats/dev/"
Repository = "https://github.com/INGEOTEC/CompStats"
Issues = "https://github.com/INGEOTEC/CompStats/issues"
