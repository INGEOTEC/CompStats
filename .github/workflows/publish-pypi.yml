name: Publish to PyPI

# Publishing is a manual step: run this workflow from the Actions tab (or with
# `gh workflow run publish-pypi.yml --ref main`). Creating a tag or a GitHub
# release does not publish anything.
on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build twine

      # CompStats is pure Python: one sdist and one universal wheel, built once.
      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      # `TWINE` is a repository secret holding a PyPI API token.
      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE }}
        run: twine upload dist/*
